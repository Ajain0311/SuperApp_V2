name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --watchAll=false
      - name: Backend Unit Tests (.NET 10)
        run: dotnet test backend/SuperApp.API.Tests/SuperApp.API.Tests.csproj
