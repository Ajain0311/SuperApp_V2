name: Playwright E2E Non-Stop Regression

on:
  schedule:
    # Runs continuously day and night every 3 hours (UTC 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00)
    - cron: '0 */3 * * *'
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: superapp-e2e-nonstop
  cancel-in-progress: false

jobs:
  playwright-e2e:
    name: Continuous Browser E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Web Application Bundle
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_ENV: prod
          EXPO_PUBLIC_API_BASE_URL: https://makemytree.duckdns.org/api
          EXPO_PUBLIC_SIGNALR_HUB_URL: https://makemytree.duckdns.org

      - name: Execute Non-Stop Playwright E2E Tests
        run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8081

      - name: Publish Test Summary to GitHub Job Summary
        if: always()
        run: |
          echo "### 🎭 Playwright E2E Test Run Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Environment:** Expo Web (Production Bundle)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frequency:** Continuous 24/7 (Every 3 Hours)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Test Results Artifacts (Screenshots & Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failed-traces-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
