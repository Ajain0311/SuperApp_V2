name: Production Auto-Deploy & Rollback

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
          - status
          - list
      tag:
        description: 'Specific release tag (optional, e.g. v-abc1234)'
        required: false
        default: ''

jobs:
  test:
    name: Run Full Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Frontend Unit Tests
        run: npm test -- --watchAll=false

      - name: Agent Framework Self-Tests
        run: npm run test:agents:self

      - name: Backend Unit Tests (.NET 10)
        run: dotnet test backend/SuperApp.API.Tests/SuperApp.API.Tests.csproj

  deploy:
    name: Deploy to Azure Production VM
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Target Tag & Action
        id: vars
        run: |
          ACTION="${{ github.event.inputs.action || 'deploy' }}"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v-${{ github.sha }}"
          fi
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Execute Deployment on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            echo "Connected to VM. Navigating to /opt/SuperApp_V2..."
            cd /opt/SuperApp_V2
            sudo chmod +x scripts/manage.sh
            sudo ./scripts/manage.sh "${{ steps.vars.outputs.action }}" "${{ steps.vars.outputs.tag }}"
