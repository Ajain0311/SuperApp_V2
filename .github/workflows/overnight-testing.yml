name: Overnight multi-agent tests

on:
  schedule:
    # 22:00–09:00 IST hourly. GitHub cron is UTC (IST = UTC+5:30).
    # 16:30–23:30 and 00:30–03:30 UTC.
    - cron: '30 16-23,0-3 * * *'
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/overnight-testing.yml'
      - 'e2e/agents/**'
  workflow_dispatch:

concurrency:
  group: superapp-overnight-testing
  cancel-in-progress: false

jobs:
  volume:
    name: 100-user full regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}
      ADMIN_MOBILE: ${{ secrets.ADMIN_MOBILE || vars.ADMIN_MOBILE }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL }}
      TEST_OTP: ${{ secrets.TEST_OTP || vars.TEST_OTP }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || vars.SUPABASE_DB_URL }}
      ConnectionStrings__SupabaseConnection: ${{ secrets.SUPABASE_CONNECTION || vars.SUPABASE_CONNECTION }}
      # Optional: postgresql://user:pass@127.0.0.1:5433/azuredb (after SSH tunnel to B-series)
      OVERNIGHT_DB_URL: ${{ secrets.OVERNIGHT_DB_URL || vars.OVERNIGHT_DB_URL }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check overnight secrets
        id: check_secrets
        run: |
          missing=0
          for name in API_BASE_URL ADMIN_PASSWORD TEST_OTP; do
            if [ -z "${!name}" ]; then
              echo "Missing secret $name"
              missing=1
            fi
          done
          if [ -z "${SUPABASE_DB_URL}" ] && [ -z "${ConnectionStrings__SupabaseConnection}" ] && [ -z "${OVERNIGHT_DB_URL}" ]; then
            echo "Missing secret SUPABASE_DB_URL, SUPABASE_CONNECTION, or OVERNIGHT_DB_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::warning::Repository secrets (API_BASE_URL, ADMIN_PASSWORD, TEST_OTP, DB URL) not configured yet. Skipping volume test."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Secrets present. Target API_BASE_URL host accepted."
          fi

      - name: Tunnel VM Postgres for DB verifier
        if: steps.check_secrets.outputs.has_secrets == 'true' && env.OVERNIGHT_DB_URL != '' && env.VM_HOST != '' && env.VM_SSH_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm.pem
          chmod 600 ~/.ssh/vm.pem
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/vm.pem -f -N -L 5433:127.0.0.1:5432 "${VM_USER}@${VM_HOST}"
          ready=0
          for i in $(seq 1 20); do
            if (echo >/dev/tcp/127.0.0.1/5433) >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Postgres SSH tunnel did not open on localhost:5433"
            exit 1
          fi
          echo "Postgres SSH tunnel up on localhost:5433"
          # Prefer the overnight tunnel URL so verifier hits the same DB as the live API.
          echo "OVERNIGHT_DB_URL=${OVERNIGHT_DB_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=${OVERNIGHT_DB_URL}" >> "$GITHUB_ENV"
          echo "ConnectionStrings__SupabaseConnection=" >> "$GITHUB_ENV"

      - name: Wait for API auth smoke (survive deploy races)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          set -euo pipefail
          smoke_mobile="9000099988"
          for i in $(seq 1 36); do
            send_code=$(curl -sS -o /tmp/otp-send.json -w '%{http_code}' \
              -X POST "$API_BASE_URL/api/auth/send-otp" \
              -H 'Content-Type: application/json' \
              -d "{\"mobileNumber\":\"$smoke_mobile\"}" || echo 000)
            if [ "$send_code" = "200" ]; then
              verify_code=$(curl -sS -o /tmp/otp-verify.json -w '%{http_code}' \
                -X POST "$API_BASE_URL/api/auth/verify-otp" \
                -H 'Content-Type: application/json' \
                -d "{\"mobileNumber\":\"$smoke_mobile\",\"otpCode\":\"$TEST_OTP\"}" || echo 000)
              if [ "$verify_code" = "200" ]; then
                echo "Auth smoke OK (send/verify 200) on attempt $i"
                exit 0
              fi
              echo "verify-otp=$verify_code on attempt $i; waiting for API settle..."
            else
              echo "send-otp=$send_code on attempt $i; waiting for API settle..."
            fi
            sleep 5
          done
          echo "::error::API auth smoke failed after ~3 minutes (deploy race or OTP_TEST_MODE missing)"
          exit 1

      - name: Run 100-user volume regression
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: npm run test:agents:volume -- --base-url "$API_BASE_URL" --customers 100 --restaurant-owners 10 --captains 20 --sellers 20 --concurrency 25 --cleanup

      - name: Write job summary
        if: always()
        run: node e2e/agents/scripts/overnight-summary.js e2e/agents/reports >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hourly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-test-report-${{ github.run_id }}
          path: e2e/agents/reports/
          retention-days: 14
          if-no-files-found: warn
